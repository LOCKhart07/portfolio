[build]
  command = "npm run build"
  publish = "build"

# No SPA catch-all: every page is a prerendered file, unknown URLs get the
# real 404.html, and persona redirect rules are generated into _redirects at
# build time (astro.config.ts → buildRedirects in src/persona/personas.ts).

[build.environment]
  NODE_VERSION = "24.15.0"

# Start of Selection
# Enable CORS headers for all routes
[[headers]]
  for = "/*"
    [headers.values]
    Access-Control-Allow-Origin = "*"
    Access-Control-Allow-Methods = "GET, POST, PUT, DELETE, OPTIONS"
    Access-Control-Allow-Headers = "Origin, X-Requested-With, Content-Type, Accept, Authorization"
# End of Selection

# Astro's hashed build assets never change under the same name: cache them
# forever so return visits skip the network entirely.
[[headers]]
  for = "/_astro/*"
    [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Agent discovery: advertise machine-readable resources on the homepage
# response (RFC 8288 Link header, RFC 9727 API Catalog). "/" is served from
# /index.html, so set the header on both request paths.
[[headers]]
  for = "/"
    [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </sitemap.xml>; rel="describedby"'

[[headers]]
  for = "/index.html"
    [headers.values]
    Link = '</.well-known/api-catalog>; rel="api-catalog", </sitemap.xml>; rel="describedby"'

# Serve the RFC 9727 API Catalog with its registered media type
[[headers]]
  for = "/.well-known/api-catalog"
    [headers.values]
    Content-Type = "application/linkset+json"

# Markdown for Agents: an edge function does Accept-based content
# negotiation on the homepage. `Accept: text/markdown` -> markdown;
# anything else falls through to the prerendered HTML.
[[edge_functions]]
  path = "/"
  function = "markdown"

[[edge_functions]]
  path = "/index.html"
  function = "markdown"

# Stable, shareable resume link — always redirects to whatever PDF is
# currently set in DatoCMS, so the shared URL never needs to change.
[[edge_functions]]
  path = "/resume"
  function = "resume"

# Remote MCP server (Streamable HTTP, stateless) exposing the JenAI
# assistant as a tool — the server-side twin of src/webmcp.ts.
[[edge_functions]]
  path = "/mcp"
  function = "mcp"